<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>签行 SignDesk · 完整工作区交互原型</title>
<style>
    :root {
      --paper: #f7f8f4; --white: #fff; --ink: #24372f; --muted: #667261;
      --forest: #214e3e; --forest-deep: #173b31; --lime: #dcebb5; --wash: #edf3e9;
      --line: #e3e7de; --line-strong: #d4dbcf; --amber: #a36320; --amber-wash: #fcf5e9;
      --red: #b44b42; --red-wash: #fbefed; --blue: #466c83;
      --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --mono: "Cascadia Code", "Consolas", monospace;
      --radius: 12px; --shadow: 0 18px 60px #1a322320;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 13px/1.65 var(--sans); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    button:disabled { cursor: not-allowed; opacity: .46; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid #a7c783; outline-offset: 3px;
    }
    input, textarea, select { min-width: 0; max-width: 100%; }
    input, select, textarea { border: 1px solid var(--line-strong); background: white; color: var(--ink); border-radius: 7px; padding: 9px 12px; }
    input::placeholder, textarea::placeholder { color: #929b92; }
    textarea { resize: vertical; line-height: 1.8; }
    h1, h2, h3, h4, p { margin: 0; }
    svg { flex: 0 0 auto; }
    .icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 84px 244px minmax(0, 1fr); }
    .global-nav { position: sticky; top: 0; height: 100vh; background: var(--forest-deep); color: #b8c9bc; display: flex; flex-direction: column; align-items: center; padding: 26px 9px 19px; z-index: 15; }
    .brand { text-decoration: none; color: var(--lime); text-align: center; }
    .brand-mark { width: 42px; height: 42px; background: var(--lime); color: var(--forest-deep); border-radius: 14px 14px 14px 4px; display: grid; place-items: center; margin: 0 auto 9px; }
    .brand-mark .icon { width: 27px; height: 27px; stroke-width: 2.2; }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: 3px; margin-left: 3px; }
    .nav-items { width: 100%; display: grid; gap: 13px; margin-top: 45px; }
    .nav-item { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 7px; min-height: 65px; border: 0; border-radius: 9px; background: transparent; color: #b8c9bc; font-size: 10px; white-space: nowrap; transition: background .16s, color .16s; }
    .nav-item .icon { width: 21px; height: 21px; }
    .nav-item:hover { color: white; background: #ffffff0d; }
    .nav-item.active { background: var(--lime); color: var(--forest-deep); }
    .nav-bottom { margin-top: auto; display: grid; justify-items: center; gap: 12px; font-size: 10px; letter-spacing: 1px; }
    .nav-bottom .prototype-dot { width: 6px; height: 6px; background: #b6d49d; border-radius: 50%; }
    .platform-pane { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: #f0f2eb; padding: 31px 18px 20px; display: flex; flex-direction: column; }
    .pane-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 20px; }
    .pane-heading h2 { font-size: 15px; font-weight: 600; }
    .pane-heading .count { color: var(--muted); margin-left: 8px; font: 12px var(--mono); }
    .icon-button { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); }
    .icon-button:hover { border-color: var(--line-strong); background: white; color: var(--forest); }
    .pane-heading .icon-button { border-color: var(--line-strong); background: #ffffff80; color: var(--forest); width: 28px; height: 28px; }
    .platform-list { display: grid; gap: 8px; }
    .platform-item { width: 100%; text-align: left; display: grid; grid-template-columns: 37px 1fr 8px; align-items: center; gap: 11px; padding: 15px 12px; border: 1px solid transparent; border-radius: 9px; background: transparent; transition: .16s; }
    .platform-item:hover { background: #ffffff90; }
    .platform-item.selected { background: white; border-color: #d7dfcf; box-shadow: 0 3px 9px #1f3d2905; }
    .platform-item.selected .platform-monogram { background: var(--forest); color: var(--lime); }
    .platform-monogram { width: 37px; height: 37px; background: #e3e8dc; border-radius: 9px; display: grid; place-items: center; color: #58674e; font: bold 21px Georgia, "Songti SC", serif; }
    .platform-item-title { font-size: 13px; font-weight: 600; display: block; }
    .platform-item-desc { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #507652; display: inline-block; flex: 0 0 auto; }
    .status-dot.off { background: #acb1a8; }
    .status-dot.warn { background: #ba853b; }
    .pane-note { margin-top: auto; padding: 18px 8px 0; border-top: 1px solid var(--line-strong); color: var(--muted); font-size: 11px; }
    .pane-note strong { display: block; font-weight: 500; color: #596552; margin-bottom: 5px; }
    .reset-demo { margin-top: 14px; padding: 0; background: none; border: 0; font-size: 11px; color: #6a7960; display: flex; align-items: center; gap: 6px; }
    .reset-demo .icon { width: 13px; height: 13px; }
    .main { min-width: 0; padding: 27px 38px 20px; max-width: 1640px; width: 100%; margin: 0 auto; }
    .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding-bottom: 21px; border-bottom: 1px solid var(--line); }
    .page-heading h1 { font-size: 22px; letter-spacing: -.5px; font-weight: 600; }
    .preview-label { display: inline-flex; align-items: center; gap: 7px; color: #7c866d; font-size: 11px; }
    .preview-label::before { content: ""; width: 5px; height: 5px; background: #a0b08a; border-radius: 50%; }
    .mobile-platform { display: none; }
    .platform-overview { padding: 24px 0 22px; display: flex; justify-content: space-between; gap: 24px; align-items: center; }
    .platform-identity { display: flex; gap: 15px; align-items: center; min-width: 0; }
    .platform-emblem { width: 54px; height: 54px; border-radius: 13px 13px 13px 4px; flex-shrink: 0; background: #e5edda; color: #466638; font: 700 32px Georgia, "Songti SC", serif; display: grid; place-items: center; }
    .identity-line { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .identity-line h2 { font: 600 30px/1.25 Georgia, "Microsoft YaHei", serif; letter-spacing: -.6px; overflow-wrap: anywhere; }
    .inline-status { font-size: 11px; color: #718064; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    .platform-note { font-size: 12px; color: var(--muted); margin-top: 7px; overflow-wrap: anywhere; }
    .platform-note .note-label { color: #9aa18e; margin-right: 7px; }
    .platform-actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; min-height: 36px; border-radius: 7px; border: 1px solid var(--line-strong); background: white; font-size: 12px; font-weight: 500; white-space: nowrap; transition: background .16s, border-color .16s; }
    .button .icon { width: 16px; height: 16px; }
    .button:hover { background: #f0f4eb; border-color: #adbd9d; }
    .button.primary { color: white; background: var(--forest); border-color: var(--forest); }
    .button.primary:hover { background: #173f30; }
    .button.danger { background: var(--red); border-color: var(--red); color: white; }
    .button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .button.ghost:hover { color: var(--forest); background: #eaf0e4; }
    .button.compact { min-height: 31px; padding: 5px 10px; font-size: 11px; }
    .text-button { display: inline-flex; gap: 5px; align-items: center; border: 0; background: transparent; padding: 5px 0; color: var(--forest); font-size: 12px; white-space: nowrap; }
    .text-button:hover { color: #122f20; text-decoration: underline; text-underline-offset: 4px; }
    .text-button .icon { width: 14px; height: 14px; }
    .schedule-strip { border: 1px solid var(--line); border-radius: 9px; background: #f0f3eb; padding: 15px 18px; display: flex; align-items: center; gap: 13px; }
    .schedule-icon { color: #7a8b67; width: 22px; height: 22px; }
    .schedule-copy { flex: 1; min-width: 0; }
    .schedule-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .schedule-title { font-size: 12px; font-weight: 600; }
    .schedule-time { font-size: 12px; color: #627158; }
    .schedule-policy { margin-top: 3px; color: #8b9380; font-size: 11px; }
    .schedule-controls { display: flex; align-items: center; gap: 19px; }
    .schedule-controls .divider { height: 17px; border-left: 1px solid #d4dccb; }
    .accounts-heading { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 14px; gap: 12px; }
    .accounts-heading h3 { font-size: 14px; font-weight: 600; }
    .accounts-heading .account-count { margin-left: 9px; font-size: 11px; color: var(--muted); font-weight: 400; }
    .collapse-control { display: flex; align-items: center; gap: 4px; }
    .collapse-control button { padding: 3px 8px; font-size: 11px; color: var(--muted); background: transparent; border: 0; border-radius: 4px; }
    .collapse-control button:hover { background: #e9eee1; color: var(--forest); }
    .collapse-control .icon { width: 13px; height: 13px; margin-right: 4px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .filter-tabs { display: flex; align-items: center; gap: 5px; }
    .filter-tab { border: 1px solid transparent; background: transparent; padding: 6px 11px; border-radius: 6px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .filter-tab:hover { background: #eef1e8; }
    .filter-tab.active { background: #e8efdf; border-color: #dfe7d5; color: var(--forest); }
    .filter-tab .tab-count { font: 11px var(--mono); opacity: .85; }
    .filter-tab.attention .tab-count { color: var(--amber); background: #f2e8d7; border-radius: 4px; padding: 2px 5px; }
    .search-controls { display: flex; align-items: center; gap: 8px; }
    .search-box { position: relative; width: 255px; }
    .search-box .icon { position: absolute; left: 10px; top: 10px; width: 15px; height: 15px; color: #8a9585; }
    .search-box input { padding: 8px 32px; width: 100%; height: 35px; font-size: 11px; border-color: var(--line); }
    .search-box kbd { position: absolute; right: 9px; top: 9px; font: 10px var(--mono); color: #a0a796; }
    .search-controls select { height: 35px; padding: 5px 28px 5px 10px; width: 120px; font-size: 11px; border-color: var(--line); }
    .account-sheet { border: 1px solid var(--line); background: white; border-radius: 11px; overflow: hidden; }
    .table-legend { display: grid; grid-template-columns: minmax(180px, 1fr) 150px 158px 138px; gap: 15px; padding: 10px 22px 10px 61px; color: #6e7767; font-size: 11px; border-bottom: 1px solid var(--line); }
    .table-legend span:last-child { text-align: right; }
    .account-group + .account-group { border-top: 1px solid var(--line); }
    .account-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 17px; min-height: 56px; background: #fafbf8; }
    .account-summary { display: flex; align-items: center; text-align: left; gap: 11px; padding: 0; border: 0; background: transparent; min-width: 0; }
    .account-summary > .icon { width: 14px; height: 14px; color: #8a9780; transition: transform .18s; }
    .account-summary[aria-expanded="false"] > .icon { transform: rotate(-90deg); }
    .account-avatar { width: 28px; height: 28px; border: 1px solid #e3e8dc; border-radius: 50%; background: #eef1e7; display: grid; place-items: center; flex-shrink: 0; color: #718060; font-size: 11px; }
    .account-name { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .account-meta { font-size: 11px; color: #79856e; font-weight: 400; margin-left: 9px; white-space: nowrap; }
    .account-summary .status-dot { margin-left: -5px; }
    .account-header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .account-header-actions .text-button { font-size: 11px; color: #6d7c61; }
    .account-header-actions .icon-button { width: 26px; height: 26px; }
    .request-row { display: grid; grid-template-columns: minmax(180px, 1fr) 150px 158px 138px; align-items: center; gap: 15px; min-height: 74px; padding: 13px 22px 13px 61px; position: relative; border-top: 1px solid #f0f2ec; transition: background .15s; }
    .request-row:hover { background: #fcfdf9; }
    .request-row.needs-attention::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; background: #d8ba82; border-radius: 0 3px 3px 0; }
    .request-row.disabled .request-title { color: #8f978a; }
    .request-title { padding: 0; text-align: left; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--ink); }
    .request-title:hover { color: var(--forest); text-decoration: underline; text-underline-offset: 4px; }
    .request-meta { font-size: 11px; color: #74816b; margin-top: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .method { font: 11px var(--mono); color: #53765c; }
    .request-meta .revision { border-left: 1px solid var(--line); padding-left: 7px; color: #76806e; }
    .state-text { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5d7652; }
    .state-text .icon { width: 13px; height: 13px; }
    .state-text.expired, .state-text.unknown { color: var(--amber); }
    .state-text.disabled { color: #78816f; }
    .state-caption { margin-top: 4px; font-size: 11px; color: #7d856f; }
    .last-run { border: 0; background: transparent; padding: 0; text-align: left; }
    .last-run:hover .last-run-time { color: var(--forest); text-decoration: underline; text-underline-offset: 4px; }
    .last-run-time { font-size: 12px; color: #69755f; display: block; }
    .last-run-detail { margin-top: 4px; font: 11px/1.65 var(--mono); color: #78836d; display: block; }
    .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    .row-action { border: 0; background: transparent; color: #627856; font-size: 12px; padding: 6px 0; white-space: nowrap; }
    .row-action:hover { color: var(--forest); text-decoration: underline; text-underline-offset: 4px; }
    .request-row.expired .row-action { color: var(--amber); font-weight: 500; }
    .row-actions .icon-button { width: 27px; height: 27px; }
    .empty-state { text-align: center; color: var(--muted); padding: 48px 20px; }
    .empty-state .icon { width: 27px; height: 27px; margin-bottom: 12px; color: #a6b296; }
    .empty-state h4 { font-size: 13px; font-weight: 500; color: #66745d; margin-bottom: 7px; }
    .empty-state p { font-size: 11px; margin-bottom: 16px; }
    .sheet-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; font-size: 10px; color: #929b8a; margin-top: 15px; }
    .sheet-footer .icon { width: 12px; height: 12px; margin-right: 5px; }
    .platform-disabled-note { padding: 10px 14px; background: #eeefe9; color: #73796c; margin-top: 16px; border-radius: 7px; font-size: 11px; }
    .menu { position: fixed; min-width: 186px; max-width: calc(100vw - 24px); z-index: 100; padding: 6px; border: 1px solid var(--line); border-radius: 9px; background: white; box-shadow: 0 8px 35px #273a2323; }
    .menu-title { font-size: 10px; color: #8e9884; padding: 6px 10px 8px; border-bottom: 1px solid #edf0e7; margin-bottom: 4px; }
    .menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: 5px; text-align: left; font-size: 11px; }
    .menu button .icon { width: 14px; height: 14px; color: #829078; }
    .menu button:hover { background: #f0f4eb; }
    .menu button.danger { color: var(--red); }
    .menu button.danger .icon { color: var(--red); }
    .menu-separator { height: 1px; background: #edf0e7; margin: 5px 4px; }
    [hidden] { display: none !important; }
    dialog { padding: 0; border: 1px solid #e1e7db; border-radius: 14px; color: var(--ink); box-shadow: var(--shadow); background: white; width: 580px; max-width: calc(100vw - 32px); max-height: calc(100dvh - 48px); overflow: auto; }
    dialog::backdrop { background: #192f2760; backdrop-filter: blur(3px); }
    .dialog-header { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; padding: 23px 25px 17px; border-bottom: 1px solid var(--line); }
    .dialog-kicker { font: 10px var(--mono); letter-spacing: 1.4px; color: #8b977e; margin-bottom: 8px; text-transform: uppercase; }
    .dialog-header h2 { font-size: 18px; font-weight: 600; }
    .dialog-subtitle { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .dialog-body { padding: 22px 25px; }
    .dialog-footer { display: flex; justify-content: flex-end; align-items: center; gap: 9px; padding: 16px 25px; border-top: 1px solid var(--line); background: #fafbf8; }
    .dialog-footer .footer-note { margin-right: auto; color: #8b977e; font-size: 10px; }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field label, .field-label { font-size: 12px; font-weight: 500; }
    .field input, .field select, .field textarea { width: 100%; font-size: 12px; }
    .field-hint { font-size: 10px; color: #87917c; line-height: 1.8; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-grid .field { margin-bottom: 10px; }
    .helper { padding: 11px 14px; border: 1px solid #e1e8d6; background: #f5f8f0; border-radius: 7px; font-size: 11px; color: #6c7c5c; line-height: 1.8; }
    .helper.warning { border-color: #f1e3c7; background: var(--amber-wash); color: #987341; }
    .helper.danger { border-color: #f0d8d3; background: var(--red-wash); color: #a16559; }
    .helper + .field { margin-top: 18px; }
    .form-error { font-size: 11px; color: var(--red); margin: 12px 0 0; }
    .check-line { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 12px; }
    .check-line input { width: 15px; height: 15px; accent-color: var(--forest); padding: 0; }
    .weekdays { display: flex; gap: 7px; flex-wrap: wrap; margin: 7px 0 18px; }
    .weekday { position: relative; }
    .weekday input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
    .weekday span { width: 37px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 11px; cursor: pointer; }
    .weekday input:checked + span { color: var(--forest); background: var(--wash); border-color: #b8c9a4; }
    .weekday input:focus-visible + span { outline: 3px solid #a7c783; outline-offset: 2px; }
    .time-fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
    .time-field { display: flex; align-items: center; gap: 2px; }
    .time-field input { width: 115px; padding: 6px 8px; }
    .time-field button { width: 23px; height: 27px; }
    .time-section { margin-bottom: 20px; }
    .steps { display: flex; align-items: center; gap: 0; padding-bottom: 21px; }
    .step { font-size: 11px; color: #a0a993; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .step span { width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font: 10px var(--mono); }
    .step.active { color: var(--forest); }
    .step.active span { background: var(--forest); border-color: var(--forest); color: white; }
    .step-connector { flex: 1; height: 1px; background: var(--line); margin: 0 12px; }
    .code { font-family: var(--mono); font-size: 11px; }
    pre.code { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f5ef; border: 1px solid var(--line); padding: 16px; border-radius: 8px; line-height: 1.9; margin: 12px 0 0; }
    .detail-grid { display: grid; grid-template-columns: 110px 1fr; gap: 13px 15px; font-size: 12px; margin-bottom: 19px; }
    .detail-grid dt { color: #8a9580; }
    .detail-grid dd { margin: 0; overflow-wrap: anywhere; }
    .drawer { position: fixed; top: 0; bottom: 0; left: auto; right: 0; margin: 0; width: 570px; max-width: min(570px, 100vw); height: 100dvh; max-height: 100dvh; border-radius: 15px 0 0 15px; display: flex; flex-direction: column; }
    .drawer:not([open]) { display: none; }
    .drawer .dialog-body { overflow-y: auto; flex: 1; }
    .drawer .dialog-header { flex-shrink: 0; padding-top: 29px; }
    .drawer .dialog-footer { flex-shrink: 0; }
    .detail-tabs { display: flex; gap: 21px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .detail-tabs button { border: 0; border-bottom: 2px solid transparent; padding: 0 0 10px; background: transparent; color: var(--muted); font-size: 12px; }
    .detail-tabs button.active { border-color: var(--forest); color: var(--forest); }
    .detail-section-title { font-size: 12px; margin: 23px 0 11px; font-weight: 600; }
    .detail-note { color: #8a9381; font-size: 11px; }
    .rule-block { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 11px; padding: 13px 15px; }
    .rule-block h4 { font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .rule-block p { font: 11px var(--mono); color: #7b8970; overflow-wrap: anywhere; }
    .rule-edit { border: 1px solid var(--line); border-radius: 7px; padding: 12px; margin-top: 10px; }

function parseDemoCurl(text){

  return {url:match[0],host:url.hostname,method};
}

  event.preventDefault();if(el.disabled)return;
  const act=el.dataset.action,id=el.dataset.id;
  const offlineAllowed=new Set(['navigate','guide','guide-tab','close-modal','close-drawer','reset','demo-empty','demo-conflict','demo-offline','retry-connection','select-platform','scope','collapse','expand','toggle-account','clear-filters','clear-plan-filter','plan-filter','run-page','clear-run-filters','request-detail','request-tab','run-detail','run-tab','format-response','locate-platform','locate-request','inspect-pending','templates','queue-drawer','batch-detail','response-example','settings-tab','refresh-system','refresh-runs','attention-platforms','menu-platform','menu-account','menu-request']);
  if(ui.offline&&!offlineAllowed.has(act))return toast('服务离线场景：写操作不可用，草稿保留，请先重试连接。');
  if(!act.startsWith('menu-'))closeMenu();
  switch(act){
    case 'navigate':navigate(el.dataset.route,{...(el.dataset.runStatus!==undefined?{runStatus:el.dataset.runStatus}:{})});break;
    case 'guide':showGuide();break;
    case 'guide-tab':showGuide(el.dataset.tab);break;
    case 'close-modal':closeModal();break;
    case 'close-drawer':closeDrawer();break;
    case 'confirm':{const cb=confirmation;closeModal();cb?.();break;}
    case 'select-platform':ui.selected=id;ui.scope='all';ui.query='';ui.status='all';ui.focusRequest=null;renderPlatforms();break;
    case 'locate-platform':ui.query='';ui.scope='all';ui.status='all';navigate('platforms',{platformId:id});break;
    case 'locate-request':ui.scope='all';ui.status='all';navigate('platforms',{requestId:id});break;
    case 'attention-platforms':{const first=allRequests().find(({r})=>needsAttention(r));ui.query='';ui.status='all';navigate('platforms',{platformId:first?.p.id,scope:'attention'});break;}
    case 'add-platform':editPlatform();break;
    case 'edit-platform':editPlatform(id);break;
    case 'save-platform':savePlatform();break;
    case 'add-account':editAccount();break;
    case 'edit-account':editAccount(id);break;
    case 'save-account':saveAccount();break;
    case 'scope':ui.scope=el.dataset.scope;collapsed.clear();renderAccounts();break;
    case 'clear-filters':ui.scope='all';ui.query='';ui.status='all';ui.focusRequest=null;renderPlatforms();break;
    case 'toggle-account':collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderAccounts();break;
    case 'expand':collapsed.clear();renderAccounts();break;
    case 'collapse':getPlatform()?.accounts.forEach(a=>collapsed.add(a.id));renderAccounts();break;
    case 'edit-schedule':scheduleModal(id);break;
    case 'add-time':{const t=$('#time-entry').value,times=$$('.time-field input',modal).map(el=>el.value);if(!t)return error('请选择有效时刻。');if(times.includes(t))return error('这个时刻已经添加。');if(times.length>=24)return error('最多添加 24 个时刻。');$('#time-fields').insertAdjacentHTML('beforeend',timeField(t));$('#form-error').hidden=true;break;}
    case 'remove-time':el.closest('.time-field').remove();break;
    case 'save-schedule':saveSchedule();break;
    case 'toggle-plan':{const s=getPlatform(id).schedule;s.enabled=!s.enabled;s.revision++;renderSchedules();toast(s.enabled?'此平台定时已启用；原型不自动触发。':'此平台定时已暂停；已有批次不受影响。');break;}
    case 'plan-filter':ui.planFilter=el.dataset.value;renderSchedules();break;
    case 'clear-plan-filter':ui.planFilter='all';renderSchedules();break;
    case 'global-pause':data.settings.paused=!data.settings.paused;data.settings.version++;settingsDraft=null;renderApp();toast(data.settings.paused?'全局定时已暂停，现有队列和手动入口继续可用。':'全局定时已恢复；原型不会自动发送请求。');break;
    case 'add-request':startWizard(id);break;
    case 'curl':startWizard(null,id);break;
    case 'sample-curl':$('#request-curl').value=sampleCurl();if(wizard)wizard.curl=sampleCurl();break;
    case 'wizard-next':wizardNext();break;
    case 'wizard-back':wizardBack();break;
    case 'wizard-save':saveWizard();break;
    case 'test-rules':testRules();break;
    case 'request-detail':showRequest(id);break;
    case 'request-tab':showRequest(id,el.dataset.tab);break;
    case 'edit-request':editRequest(id);break;
    case 'save-request':saveRequest();break;
    case 'inspect-pending':{const l=latestRun(id);if(l)showRun(l.id);else showRequest(id);break;}
    case 'templates':showTemplates(id);break;
    case 'add-template':editTemplate(id);break;
    case 'edit-template':editTemplate(el.dataset.platform,id);break;
    case 'save-as-template':editTemplate(null,null,id);break;
    case 'save-template':saveTemplate();break;
    case 'delete-template':deleteEntity('template',id,el.dataset.platform);break;
    case 'menu-platform':{const p=getPlatform(id);openMenu(el,p.name,[{label:'编辑名称与备注',icon:'edit',action:'edit-platform',id},{label:p.enabled?'停用平台':'启用平台',icon:'power',action:'toggle-platform',id},'separator',{label:'删除平台',icon:'trash',action:'delete-platform',id,danger:true}]);break;}
    case 'menu-account':{const {a}=getAccount(id);openMenu(el,a.name,[{label:'编辑账号别名',icon:'edit',action:'edit-account',id},{label:a.enabled?'停用账号':'启用账号',icon:'power',action:'toggle-enabled-account',id},'separator',{label:'删除账号',icon:'trash',action:'delete-account',id,danger:true}]);break;}
    case 'menu-request':{const {r}=findRequest(id);openMenu(el,r.name,[{label:'请求详情',icon:'info',action:'request-detail',id},{label:'编辑名称与规则',icon:'edit',action:'edit-request',id},{label:'更新 cURL',icon:'refresh',action:'curl',id},{label:r.enabled?'停用请求':'启用请求',icon:'power',action:'toggle-request',id},'separator',{label:'执行此请求',icon:'play',action:'run-request',id},{label:'重新执行（需确认）',icon:'refresh',action:'rerun',id},{label:'保存规则为模板',icon:'template',action:'save-as-template',id},'separator',{label:'删除请求',icon:'trash',action:'delete-request',id,danger:true}]);break;}
    case 'toggle-platform':{const p=getPlatform(id);p.enabled=!p.enabled;p.version++;refreshAfterChange();toast('平台启停已更新，发送前会再次复核。');break;}
    case 'toggle-enabled-account':{const {a}=getAccount(id);a.enabled=!a.enabled;a.version++;refreshAfterChange();toast('账号启停已更新，不改变请求自身的配置。');break;}
    case 'toggle-request':{const {r}=findRequest(id);if(!r.enabled&&!r.hasCurl)return toast('此请求尚未配置 cURL，请先更新完整请求。');r.enabled=!r.enabled;r.version++;refreshAfterChange();toast('请求启停已更新；日标记与凭证暂停仍保留。');break;}
    case 'delete-platform':deleteEntity('platform',id);break;
    case 'delete-account':deleteEntity('account',id);break;
    case 'delete-request':deleteEntity('request',id);break;
    case 'run-all':runAction('all');break;
    case 'run-platform':runAction('platform',id);break;
    case 'run-request':runAction('request',id);break;
    case 'rerun':runAction('request',id,true);break;
    case 'queue-drawer':showQueue();break;
    case 'batch-detail':showBatch(id);break;
    case 'cancel-batch':cancelBatch(id);break;
    case 'run-detail':showRun(id);break;
    case 'run-tab':showRun(id,el.dataset.tab);break;
    case 'format-response':{const l=data.runs.find(l=>l.id===id),next=!drawerContext.formatted;if(next){try{JSON.parse(l.response.body);}catch{return toast('正文不是有效 JSON，保留原始纯文本。');}}showRun(id,'response',next);break;}
    case 'run-page':ui.runFilter.page=Number(el.dataset.page);renderRuns();break;
    case 'clear-run-filters':ui.runFilter={platformId:'',status:'',source:'',page:1,size:ui.runFilter.size};renderRuns();break;
    case 'refresh-runs':renderRuns();toast('示例记录已刷新；真实接入使用 GET /api/runs。');break;
    case 'settings-tab':if(ui.settingsTab==='backup'&&el.dataset.tab!=='backup'){backupSession++;backupDraft=null;backupPreview=null;backupName='';}ui.settingsTab=el.dataset.tab;renderSettings();break;
    case 'save-settings':saveSettings();break;
    case 'reload-settings':confirmAction('放弃未保存的修改？','将重新载入已经保存的执行偏好与代理配置，当前草稿会丢弃。','重新载入',()=>{settingsDraft=clone(data.settings);renderSettings();toast('已载入最新示例配置。');});break;
    case 'export-backup':exportBackup();break;
    case 'sample-backup':useSampleBackup();break;
    case 'preview-backup':previewBackup();break;
    case 'confirm-import':confirmImport();break;
    case 'import-backup':importBackup();break;
    case 'refresh-system':renderSettings();toast('系统状态为模拟数据，未连接真实服务。');break;
    case 'demo-offline':ui.offline=true;closeDrawer();renderApp();toast('已进入服务离线演示，点击“重试连接”恢复。');break;
    case 'retry-connection':ui.offline=false;renderApp();toast('模拟连接已恢复，不会重放任何请求。');break;
    case 'demo-conflict':if(!settingsDraft)settingsDraft=clone(data.settings);data.settings.version++;ui.settingsTab='execution';navigate('settings');toast('另一页面修改了示例版本，保存旧草稿会提示冲突。');break;
    case 'demo-empty':confirmAction('体验空白工作区','将清除当前原型状态，切换到没有平台、请求和日志的空白场景。可随时恢复示例。','切换空白场景',()=>{resetData(true);toast('已切换空白工作区。');});break;
    case 'response-example':if(data.runs.some(l=>l.id===id))showRun(id,'response');else toast('样例已经清除，可先恢复完整示例。');break;
    case 'reset':confirmAction('恢复完整示例','将清除本页所有临时修改、队列和导入文件，恢复初始示例；不操作真实配置。','恢复示例',()=>{resetData();toast('完整示例已恢复。');});break;
  }
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='request-search'){ui.query=el.value;ui.focusRequest=null;collapsed.clear();renderAccounts();}
  if(['setting-concurrency','setting-timeout','setting-retention','proxy-host','proxy-port'].includes(el.id))updateSettingsInput(el);
  if(wizard&&el.id==='request-name')wizard.name=el.value;
  if(wizard&&el.id==='request-curl')wizard.curl=el.value;
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='mobile-platform'){if(el.value==='__new'){el.value=ui.selected;editPlatform();}else{ui.selected=el.value;ui.query='';ui.scope='all';ui.status='all';renderPlatforms();}}
  if(el.id==='status-filter'){ui.status=el.value;collapsed.clear();renderAccounts();}
  if(el.id==='schedule-frequency')$('#weekday-section').hidden=el.value==='daily';
  if(el.matches('[data-rule-type]')){const block=el.closest('.rule-edit'),text=el.value==='text';$('[data-rule-path]',block).disabled=text;$('[data-rule-value]',block).placeholder=text?'包含的文本':'JSON 值：0、"0"、true';}
  if(el.id==='request-template'&&wizard){
    if(!el.value){wizard.template='';return;}
    const t=getPlatform(wizard.platformId).templates.find(t=>t.id===el.value),name=$('#request-name').value;
    if(JSON.stringify({name,rules:wizard.rules})!==wizard.baseline&&!window.confirm('套用模板将覆盖手工填写的名称与规则，但不会修改已粘贴的 cURL、账号或启停状态。是否继续？')){el.value=wizard.template;return;}
    wizard.name=t.name;wizard.rules=clone(t.rules);wizard.template=t.id;wizard.baseline=JSON.stringify({name:t.name,rules:wizard.rules});$('#request-name').value=t.name;
  }
  const runFields={'run-platform-filter':'platformId','run-status-filter':'status','run-source-filter':'source'};
  if(runFields[el.id]){ui.runFilter[runFields[el.id]]=el.value;ui.runFilter.page=1;renderRuns();}
  if(el.id==='run-page-size'){ui.runFilter.size=Number(el.value);ui.runFilter.page=1;renderRuns();}
  if(el.id==='setting-paused')updateSettingsInput(el);
  if(el.name==='proxy-mode'){settingsDraft.proxy.mode=el.value;renderSettings();}
  if(el.name==='export-mode'){exportFull=el.value==='full';renderSettings();}
  if(el.id==='backup-file')readPrototypeFile(el.files?.[0]);
});
document.addEventListener('dragover',event=>{const drop=event.target.closest('#file-drop');if(drop){event.preventDefault();drop.classList.add('dragging');}});
document.addEventListener('dragleave',event=>{event.target.closest('#file-drop')?.classList.remove('dragging');});
document.addEventListener('drop',event=>{const drop=event.target.closest('#file-drop');if(drop){event.preventDefault();drop.classList.remove('dragging');readPrototypeFile(event.dataTransfer.files?.[0]);}});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!menu.hidden){event.preventDefault();closeMenu();menuTrigger?.focus();}
  if(!menu.hidden&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const buttons=$$('button',menu),index=buttons.indexOf(document.activeElement);buttons[(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();}
  if((event.key==='/'||((event.ctrlKey||event.metaKey)&&event.key==='k'))&&!modal.open&&!drawer.open&&!event.target.matches('input,textarea,select')){const search=$('#request-search');if(search){event.preventDefault();search.focus();}}
  if(event.key==='Enter'&&modal.open&&event.target.matches('input[type="text"],input:not([type])')){if(modalContext?.kind==='platform'){event.preventDefault();savePlatform();}else if(modalContext?.kind==='account'){event.preventDefault();saveAccount();}}
});
window.addEventListener('resize',closeMenu);
window.addEventListener('scroll',()=>{if(!menu.hidden)positionMenu();},true);
modal.addEventListener('cancel',event=>{event.preventDefault();closeModal();});
drawer.addEventListener('cancel',event=>{event.preventDefault();closeDrawer();});
modal.addEventListener('close',()=>{if(!modal.open){modal.replaceChildren();wizard=null;confirmation=null;modalContext=null;}});
drawer.addEventListener('close',()=>{if(!drawer.open){drawer.replaceChildren();drawerContext=null;}});
window.addEventListener('beforeunload',()=>{closeDrawer();closeModal();backupDraft=null;backupPreview=null;});
function syncRouteFromLocation(){
  const candidate=location.hash.slice(1),route=['overview','platforms','schedules','runs','settings'].includes(candidate)?candidate:'overview';
  if(route===ui.route)return;
  if(ui.route==='settings'&&dirtySettings()){
    history.pushState(null,'','#'+ui.route);
    navigate(route);
  }else navigate(route,{fromHistory:true},true);
}
window.addEventListener('popstate',syncRouteFromLocation);
window.addEventListener('hashchange',syncRouteFromLocation);
const initialRoute=location.hash.slice(1);if(['overview','platforms','schedules','runs','settings'].includes(initialRoute))ui.route=initialRoute;
history.replaceState(null,'','#'+ui.route);
renderApp();
setInterval(queueTick,650);

</script>
</body>
