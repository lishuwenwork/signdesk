services:
  signdesk:
    build: .
    ports:
      # Host and container ports must match: RequestBoundary compares the browser
      # Origin port with the port Tomcat received the request on.
      - "127.0.0.1:${SIGNDESK_PORT:-10500}:${SIGNDESK_PORT:-10500}"
    environment:
      SIGNDESK_PORT: ${SIGNDESK_PORT:-10500}
      SIGNDESK_ALLOWED_HOSTS: ${SIGNDESK_ALLOWED_HOSTS:-}
      SIGNDESK_AUTH_USERNAME: ${SIGNDESK_AUTH_USERNAME:-admin}
      SIGNDESK_AUTH_PASSWORD: ${SIGNDESK_AUTH_PASSWORD:-123456}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}
    volumes:
      - signdesk-data:/app/data
    restart: unless-stopped
    stop_grace_period: 35s
volumes:
  signdesk-data:
