server:
  address: ${SIGNDESK_BIND_ADDRESS:127.0.0.1}
  port: ${SIGNDESK_PORT:8080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 12MB
spring:
  application:
    name: signdesk
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      enabled: false
signdesk:
  data-dir: ${SIGNDESK_DATA_DIR:./data}
  key-file: ${SIGNDESK_KEY_FILE:./secrets/master.key}
  secret-key: ${SIGNDESK_SECRET_KEY:}
  allowed-hosts: ${SIGNDESK_ALLOWED_HOSTS:}
  scan-delay-ms: 5000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
