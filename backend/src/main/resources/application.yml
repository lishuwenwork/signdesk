server:
  address: ${SIGNDESK_BIND_ADDRESS:127.0.0.1}
  port: ${SIGNDESK_PORT:10500}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      persistent: false
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    max-http-form-post-size: 12MB
spring:
  application:
    name: signdesk
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      enabled: false
signdesk:
  auth:
    username: admin
    password: "123456"
  data-dir: ${SIGNDESK_DATA_DIR:${user.home}/.signdesk/data}
  allowed-hosts: ${SIGNDESK_ALLOWED_HOSTS:}
  scan-delay-ms: 5000
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
