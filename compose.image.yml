services:
  signdesk:
    image: ${SIGNDESK_IMAGE:-signdesk:0.1.0}
    pull_policy: never
    ports:
      - "127.0.0.1:${SIGNDESK_PORT:-10500}:${SIGNDESK_PORT:-10500}"
    environment:
      SIGNDESK_BIND_ADDRESS: 0.0.0.0
      SIGNDESK_PORT: ${SIGNDESK_PORT:-10500}
      SIGNDESK_DATA_DIR: /app/data
      SIGNDESK_ALLOWED_HOSTS: ${SIGNDESK_ALLOWED_HOSTS:-}
    volumes:
      # Host path is configurable; the container always sees SQLite at /app/data.
      # Default keeps the existing per-user location. create_host_path stays false so a
      # missing directory fails loudly instead of being created root-owned.
      - type: bind
        source: ${SIGNDESK_HOST_DATA:-${HOME}/.signdesk/data}
        target: /app/data
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:$${SIGNDESK_PORT}/api/system/status > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
